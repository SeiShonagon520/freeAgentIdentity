# Copy this file to config.yaml on the deployment host and replace the
# subscription URL. config.yaml is ignored by Git and the Docker build context.
mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

# The controller and mixed proxy port are only exposed to the private compose
# network; docker-compose.yml does not publish either port to the host.
external-controller: 0.0.0.0:9090
secret: ""

profile:
  store-selected: true
  store-fake-ip: false

proxy-providers:
  registration-subscription:
    type: http
    url: "REPLACE_WITH_CLASH_SUBSCRIPTION_URL"
    header:
      User-Agent:
        - "Clash.Meta"
    path: ./providers/registration-subscription.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: false

proxy-groups:
  - name: REGISTER-ALL
    type: select
    use:
      - registration-subscription
  - name: REGISTER-US
    type: select
    use:
      - registration-subscription
    filter: '(?i)(🇺🇸|美国|美國|United States|\bUS\b|USA)'
  - name: REGISTER-SLOT-01
    type: select
    use:
